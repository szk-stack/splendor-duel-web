# 璀璨宝石：对决 - nginx 站点配置
# 放置位置: /etc/nginx/sites-available/splendor.conf -> 软链到 sites-enabled
# 把 your.domain.com 替换为你的域名；证书路径为 certbot 默认路径

server {
    listen 80;
    server_name your.domain.com;
    # HTTP 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name your.domain.com;

    ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 前端静态文件（npm run build 产物）
    root /opt/splendor/web/dist;
    index index.html;

    # SPA 路由回退（HashRouter 下其实用不到，保留兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 反代：必须传 Upgrade 头；读超时与客户端心跳(25s)匹配
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
